# Local development services. Application containers (api, web) are added in Phase 2/3.
# Credentials here are for local development only; never reuse them elsewhere.
name: wageguard

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wageguard
      POSTGRES_USER: wageguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wageguard-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wageguard -d wageguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
