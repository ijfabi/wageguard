# Local stack: `docker compose up --build` starts PostgreSQL and Redis, applies database
# migrations, then starts the API on http://localhost:3001 (OpenAPI at /api/v1/openapi.json) and
# the web app on http://localhost:3000.
# Optional tracing and metrics: see docs/observability.md
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 docker compose --profile observability up --build
# Credentials here are for local development only; never reuse them elsewhere.
name: wageguard

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wageguard
      POSTGRES_USER: wageguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wageguard-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wageguard -d wageguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://wageguard:${POSTGRES_PASSWORD:-wageguard-local-only}@postgres:5432/wageguard
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wageguard:${POSTGRES_PASSWORD:-wageguard-local-only}@postgres:5432/wageguard
      ALLOWED_ORIGINS: http://localhost:3000
      # Browsers treat http://localhost as a secure context, so Secure cookies work locally.
      COOKIE_SECURE: "true"
      # Empty (the default) leaves OpenTelemetry off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Local-only OpenTelemetry backend (collector, Tempo, Prometheus, Loki, Grafana) for development.
  # Grafana: http://localhost:3003 (anonymous access, bound to localhost only).
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3003:3000"
      - "127.0.0.1:4318:4318"

volumes:
  postgres-data:
  redis-data:
