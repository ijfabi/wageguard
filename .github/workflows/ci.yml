# Continuous integration. Actions are pinned to full commit SHAs (tag shown in the comment).
# Benchmarks are intentionally NOT run here: their noise on shared runners has not been evaluated.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, build, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Coverage thresholds (90% lines/branches/functions/statements) are enforced in each package's
      # vitest.config.ts; the calculation engine run fails the job if it drops below them.
      # The API suite starts a throwaway PostgreSQL with Testcontainers (Docker is available on
      # GitHub-hosted Ubuntu runners) and applies the real migrations.
      - run: pnpm test:coverage
      - name: Rule set integrity
        run: pnpm --filter @wageguard/award-rules fingerprint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/
          retention-days: 14

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit (fails on high or critical)
        run: pnpm audit --audit-level high
      # Runs the gitleaks binary directly (pinned version, checksum verified) over the full history,
      # rather than through a wrapper action. Fails the job if any secret is found.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  migrations:
    name: Migration check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: wageguard_ci
          POSTGRES_USER: wageguard
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wageguard -d wageguard_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://wageguard:ci-only-password@localhost:5432/wageguard_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to an empty database
        run: pnpm --filter @wageguard/api exec prisma migrate deploy
      - name: Fail if schema.prisma and the migrations have drifted
        run: pnpm --filter @wageguard/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  container:
    name: Container build and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API runtime image
        run: docker build -f apps/api/Dockerfile --target runtime -t wageguard-api:ci .
      - name: Build web runtime image
        run: docker build -f apps/web/Dockerfile --target runtime -t wageguard-web:ci .
      - name: Scan API image (fails on fixable HIGH/CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wageguard-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image (fails on fixable HIGH/CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wageguard-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra:
    name: Terraform format and validate (never applied)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TERRAFORM: docker run --rm -v ${{ github.workspace }}/infra/aws:/work -w /work hashicorp/terraform:1.16.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: $TERRAFORM fmt -check -recursive
      # No backend and no credentials: this only downloads the pinned providers and checks the code.
      - name: Initialise without a backend
        run: $TERRAFORM init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: $TERRAFORM validate

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: wageguard_e2e
          POSTGRES_USER: wageguard
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wageguard -d wageguard_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://wageguard:ci-only-password@localhost:5432/wageguard_e2e
      API_ORIGIN: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @wageguard/web build
      - run: pnpm --filter @wageguard/api exec prisma migrate deploy
      - run: pnpm --filter @wageguard/web exec playwright install --with-deps chromium
      - run: pnpm --filter @wageguard/web e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
